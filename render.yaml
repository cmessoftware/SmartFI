services:
  # Backend API — Starter keeps the instance always-on (no free-tier cold starts).
  - type: web
    name: smartfi-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard: Neon PostgreSQL connection string
      - key: GOOGLE_SHEET_ID
        sync: false  # Optional: Configure for backup
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false  # Optional: Paste credentials for Google Sheets backup
      - key: FRONTEND_URL
        sync: false  # Configure after frontend deploys

  # Frontend — Static Site (free CDN, no spin-down). Replaces Docker/nginx web service.
  # If smartfi-frontend already exists as Docker, create this as a new static service
  # or delete the old one and sync the blueprint again.
  - type: web
    name: smartfi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false  # e.g. https://smartfi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Database is hosted on Neon (external) — configure DATABASE_URL in Render dashboard
